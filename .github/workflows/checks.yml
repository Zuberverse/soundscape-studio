name: Studio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check generated workflows
        run: |
          python3 scripts/build-workflows.py
          git diff --exit-code -- workflows studio/frame-presets.json
      - run: npx playwright install --with-deps chromium
      - name: Exercise the studio without paid generation
        run: |
          npm start > "$RUNNER_TEMP/soundscape-server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4317/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
